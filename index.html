<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Floc - Belanja & Stok</title>
<style>
:root{
  --steel:#DDE4E6; --paper:#FBFCFB; --ink:#10262B; --muted:#5E7176; --line:#D3DCDE;
  --herb:#1F8A55; --chili:#D9381E; --butter:#E9B824; --herb-bg:#E3F3EA; --chili-bg:#FBE6E1; --butter-bg:#FBF1CF;
  --head:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--steel);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 14px}
.brand b{font-family:var(--head);font-size:24px;font-weight:800;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
h2,h3{font-family:var(--head);margin:0;font-weight:800}
h2{font-size:30px;line-height:1.05}
h3{font-size:21px}
.mut{color:var(--muted)}
.small{font-size:13px}

/* ticket */
.ticket{position:relative;background:var(--paper);padding:14px 14px 16px;margin:0 0 26px;
  filter:drop-shadow(0 1px 0 rgba(16,38,43,.14)) drop-shadow(0 6px 8px rgba(16,38,43,.07))}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:conic-gradient(from 135deg at top,#0000,var(--paper) 1deg 89deg,#0000 90deg) 50%/16px 100%}
.tk-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:2px;border-bottom:2px dashed var(--line)}
.cnt{font-family:var(--head);font-weight:800;font-size:17px;color:var(--chili)}
.cnt.full{color:var(--herb)}

/* progress */
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--herb);transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.next{display:inline-block;margin-top:10px;background:var(--butter-bg);border-left:4px solid var(--butter);padding:6px 10px;font-size:14px}

/* controls */
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--chili);color:var(--chili)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .grow{flex:1}
select,input[type=text],input[type=date],textarea{width:100%;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:44px}
select:focus,input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:150px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.chips{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;min-height:38px}
.chip.on{background:var(--ink);color:var(--paper)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:10px 6px;font-weight:700;min-height:44px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button.on.s-masuk{background:var(--herb)}
.seg button.on.s-sebagian{background:var(--butter);color:var(--ink)}
.seg button.on.s-belum{background:var(--chili)}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{flex:none;width:40px;height:40px;border:2px solid var(--ink);background:#fff;border-radius:10px;display:grid;place-items:center;color:transparent}
.row.masuk .chk{background:var(--herb);border-color:var(--herb);color:#fff}
.row.sebagian .chk{background:var(--butter);border-color:var(--butter);color:var(--ink)}
.info{flex:1;min-width:0;text-align:left;border:0;background:none;padding:4px 0}
.nm{display:block;font-weight:600;overflow-wrap:anywhere}
.row.masuk .nm{text-decoration:line-through;color:var(--muted);font-weight:500}
.nt{display:block;font-size:13px;color:var(--chili)}
.qty{flex:none;font-family:var(--head);font-weight:800;font-size:18px;text-align:right;max-width:38%}
.row.masuk .qty{color:var(--muted)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{border:0;background:transparent;color:#B9C7CA;padding:10px 4px;border-radius:10px;font-weight:700;min-height:48px}
nav button.on{background:var(--paper);color:var(--ink)}

/* report */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 22px}
.tile{background:var(--paper);padding:10px 12px;border-left:6px solid var(--ink)}
.tile b{font-family:var(--head);font-size:30px;display:block;line-height:1}
.tile.t-masuk{border-color:var(--herb)} .tile.t-keluar{border-color:var(--chili)} .tile.t-pindah{border-color:var(--butter)} .tile.t-belum{border-color:var(--muted)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item2{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item2:last-child{border-bottom:0}
.item2 .r{text-align:right;flex:none;max-width:45%}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px}
.b-masuk{background:var(--herb-bg);color:var(--herb)} .b-keluar{background:var(--chili-bg);color:var(--chili)} .b-pindah{background:var(--butter-bg);color:#7A5B00}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(16,38,43,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
.panel{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{padding:6px 0}
@media print{nav,.noprint,#toast{display:none!important}body{background:#fff;padding:0}.ticket{filter:none;border:1px solid #999}.ticket::after{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Kitchen Floc</b><span id="today"></span></div>
  <main id="app"></main>
</div>
<nav class="noprint"><div>
  <button data-view="belanja">Belanja</button>
  <button data-view="catat">Catat barang</button>
  <button data-view="laporan">Laporan</button>
</div></nav>
<div id="sheet" data-act="close"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const KEY='floc-kitchen-v1';
const SEED=`*Belanjaan besok kitchen*
13/11/2026

*Pajak:*
Plastik PE 1/4 kg 1 bks
Emping 1/2 kg
Buncis 1/2 kg
Daun pre 1/4 kg
Daun pisang 1 ikat kecil
Ebi 1 ons
Daun kari 1 ons
Beras 10 kg
Telur 5 ppn

*Market:*
Saus blackpaper 2 Bks
Totole 1 bks
Romain lettuce 2 Bks
Cream cheese 1 kg(butuh 1 kg lagi)
Roti tawar 2 Bks
Tepung double zero 1 Bks
Keju Mozarella 3 Bks
Keju slice 2 bks
Keju cedar 2 bks
Ghost paper 4 Bks
Minyak 8 liter
Nugget 2 bks
Telur asin 5 Bks
Tomato basil 1 btl
Lemon 1 buah
Enoki 2 pack
Koking cream 1 Bks
Paprika hijau 1 buah
Paprika merah 1 buah
Teriyaki 2 btl
Nori 1 bks
Gula PSMS 1 kg

*Supplier:*
Calamry 1 kg
Udang 2 kg
Bakso ikan 1 bks
Daging minced 2 Bks

*Frozen:*
Kentang sostring 5 kg
Tortilla 1 Bks

*Lainnya :*
Plastik vakum 10x12 1 Bks

*Kebersihan:*
sabun cuci piring 1 dirigen
Rinso 1
trashback besar hitam 1
trashback gulung 1
hand glove plastik 5`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>{const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const fmtShort=s=>{const[,m,d]=s.split('-');return `${d}/${m}`};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const dayName=s=>HARI[parseISO(s).getDay()];
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const LOCS=['Gudang kering','Chiller','Freezer','Kitchen','Bar','Pastry','Outlet'];

/* ---------- state ---------- */
const S={lists:[],moves:[],active:null,view:'belanja',filter:'semua',
  rep:{from:addDays(today(),-2),to:today()},
  draft:{type:'keluar',date:today(),name:'',qty:'',from:'',to:'',note:''},
  delArmed:false};
let saveTimer;
async function load(){try{if(window.storage){const r=await window.storage.get(KEY,false);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}return null}
async function save(){try{if(window.storage)await window.storage.set(KEY,JSON.stringify({lists:S.lists,moves:S.moves,active:S.active}),false)}catch(e){console.error('Storage error',e)}}
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(save,200)}
const curList=()=>S.lists.find(l=>l.id===S.active)||null;
const findItem=id=>{for(const l of S.lists){const i=l.items.find(x=>x.id===id);if(i)return i}return null};

/* ---------- parse teks WhatsApp ---------- */
function parseList(text){
  const units='kg|ons|bks|bungkus|btl|botol|buah|pack|ikat|liter|ltr|ppn|dirigen|pcs|gr|gram|pak|box|roll|karung|slop|kotak';
  const splitRe=new RegExp('\\s(?=\\d[\\d/.,]*\\s*(?:'+units+')\\b)','i');
  let date=null,cat='Lainnya';const items=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const dm=line.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(dm){if(!date)date=`${dm[3]}-${pad(dm[2])}-${pad(dm[1])}`;continue}
    if(/^\*.*\*$/.test(line)||/^\*.*:\*?$/.test(line)){
      if(line.includes(':')){cat=line.replace(/[*:]/g,'').trim()||cat}
      continue;
    }
    const l=line.replace(/^[-•*]\s*/,'').trim();if(!l)continue;
    let name=l,qty='',note='';
    let m=splitRe.exec(l);
    if(m){name=l.slice(0,m.index).trim();qty=l.slice(m.index).trim()}
    else{m=/\s(\d+)\s*$/.exec(l);if(m){name=l.slice(0,m.index).trim();qty=m[1]}}
    const pm=qty.match(/^(.*?)\s*\((.*)\)\s*$/);
    if(pm){qty=pm[1].trim();note=pm[2].trim()}
    items.push({id:uid(),cat,name,qty,status:'belum',recv:'',note,receivedAt:''});
  }
  return{date,items};
}
function listToText(L){
  const cats=[...new Set(L.items.map(i=>i.cat))];
  let t=`*Belanjaan kitchen*\n${fmt(L.date)}\n`;
  cats.forEach(c=>{
    t+=`\n*${c}:*\n`;
    L.items.filter(i=>i.cat===c).forEach(i=>{
      t+=`${i.status==='masuk'?'✅ ':i.status==='sebagian'?'🟡 ':''}${i.name}${i.qty?' '+i.qty:''}${i.note?' ('+i.note+')':''}\n`;
    });
  });
  return t.trim();
}

/* ---------- moves ---------- */
function syncMove(it){
  S.moves=S.moves.filter(m=>m.itemId!==it.id);
  if(it.status!=='belum'){
    S.moves.push({id:uid(),itemId:it.id,type:'masuk',date:it.receivedAt||today(),name:it.name,qty:it.recv||it.qty,from:it.cat,to:'',
      note:(it.status==='sebagian'?'Masuk sebagian. ':'')+(it.note||'')});
  }
}

/* ---------- views ---------- */
const CHECK='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DASH='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

function row(i){
  const ic=i.status==='masuk'?CHECK:i.status==='sebagian'?DASH:CHECK;
  const lbl=i.status==='masuk'?'Tandai belum masuk':'Tandai sudah masuk';
  const note=[i.status==='sebagian'?('Masuk '+(i.recv||'sebagian')):'',i.note].filter(Boolean).join(' · ');
  return `<div class="row ${i.status}">
    <button class="chk" data-act="toggle" data-id="${i.id}" aria-label="${lbl}: ${esc(i.name)}">${ic}</button>
    <button class="info" data-act="edit" data-id="${i.id}"><span class="nm">${esc(i.name)}</span>${note?`<span class="nt">${esc(note)}</span>`:''}</button>
    <span class="qty">${esc(i.qty)}</span></div>`;
}

function viewBelanja(){
  const L=curList();
  if(!L)return `<section class="ticket"><h2>Belum ada daftar belanja</h2><p class="mut">Tempel teks belanjaan dari WhatsApp, daftar langsung jadi.</p><div class="btns"><button class="btn primary" data-act="newlist">Buat daftar belanja</button></div></section>`;
  const total=L.items.length,done=L.items.filter(i=>i.status==='masuk').length;
  const pct=total?Math.round(done/total*100):0;
  const sorted=[...S.lists].sort((a,b)=>b.date.localeCompare(a.date));
  const cats=[...new Set(L.items.map(i=>i.cat))];
  const f=S.filter;
  const blocks=cats.map(c=>{
    const its=L.items.filter(i=>i.cat===c);
    const shown=its.filter(i=>f==='semua'||(f==='belum'?i.status!=='masuk':i.status==='masuk'));
    if(!shown.length)return '';
    const d=its.filter(i=>i.status==='masuk').length;
    return `<section class="ticket"><div class="tk-head"><h3>${esc(c)}</h3><span class="cnt ${d===its.length?'full':''}">${d}/${its.length}</span></div>${shown.map(row).join('')}</section>`;
  }).join('');
  const emptyMsg=f==='belum'?'Semua barang sudah masuk.':f==='masuk'?'Belum ada barang yang masuk.':'Daftar masih kosong. Tambah barang dulu.';
  return `
  <section class="ticket">
    <select id="listSel" aria-label="Pilih daftar belanja">${sorted.map(l=>`<option value="${l.id}" ${l.id===L.id?'selected':''}>Belanja ${dayName(l.date)}, ${fmt(l.date)}</option>`).join('')}</select>
    <h2 style="margin-top:14px">${dayName(L.date)}, ${fmt(L.date)}</h2>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="meta"><b>${done} dari ${total} sudah masuk</b><span class="mut">${total-done} belum</span></div>
    <div class="next">Belanja berikutnya: ${dayName(addDays(L.date,3))}, ${fmt(addDays(L.date,3))}</div>
    <div class="btns">
      <button class="btn primary grow" data-act="add">Tambah barang</button>
      <button class="btn grow" data-act="newlist">Daftar baru</button>
      <button class="btn grow" data-act="copylist">Salin ke WhatsApp</button>
    </div>
  </section>
  <div class="chips" role="group" aria-label="Filter barang">
    ${[['semua','Semua'],['belum','Belum masuk'],['masuk','Sudah masuk']].map(([v,t])=>`<button class="chip ${f===v?'on':''}" data-act="filter" data-v="${v}">${t}</button>`).join('')}
  </div>
  ${blocks||`<section class="ticket"><p class="empty mut">${emptyMsg}</p></section>`}
  <div class="noprint" style="text-align:center;margin-top:-6px"><button class="btn sm danger" data-act="dellist">${S.delArmed?'Tap lagi untuk hapus daftar ini':'Hapus daftar ini'}</button></div>`;
}

function allNames(){
  const s=new Set();S.lists.forEach(l=>l.items.forEach(i=>s.add(i.name)));S.moves.forEach(m=>s.add(m.name));
  return [...s].sort().map(n=>`<option value="${esc(n)}">`).join('');
}
const TYPE_LABEL={masuk:'Masuk',keluar:'Keluar',pindah:'Pindah'};

function viewCatat(){
  const d=S.draft;
  const recent=[...S.moves].sort((a,b)=>b.date.localeCompare(a.date)||0).slice(0,40);
  return `
  <section class="ticket">
    <h2>Catat barang</h2>
    <p class="mut small" style="margin:4px 0 10px">Barang masuk dari daftar belanja tercatat otomatis saat dicentang.</p>
    <div class="seg" role="group" aria-label="Jenis catatan">
      ${['keluar','pindah','masuk'].map(t=>`<button class="${d.type===t?'on':''}" data-act="pickType" data-v="${t}">Barang ${t}</button>`).join('')}
    </div>
    <label for="f-date">Tanggal</label><input type="date" id="f-date" data-f="date" value="${d.date}">
    <label for="f-name">Nama barang</label><input type="text" id="f-name" data-f="name" list="names" value="${esc(d.name)}" autocomplete="off">
    <datalist id="names">${allNames()}</datalist>
    <label for="f-qty">Jumlah</label><input type="text" id="f-qty" data-f="qty" value="${esc(d.qty)}" placeholder="contoh: 2 kg">
    ${d.type==='pindah'?`
    <div class="dates">
      <div><label for="f-from">Dari</label><input type="text" id="f-from" data-f="from" list="locs" value="${esc(d.from)}"></div>
      <div><label for="f-to">Ke</label><input type="text" id="f-to" data-f="to" list="locs" value="${esc(d.to)}"></div>
    </div><datalist id="locs">${LOCS.map(l=>`<option value="${l}">`).join('')}</datalist>`:''}
    <label for="f-note">Keterangan (boleh kosong)</label><input type="text" id="f-note" data-f="note" value="${esc(d.note)}" placeholder="${d.type==='keluar'?'dipakai untuk apa':d.type==='pindah'?'catatan':'dari mana'}">
    <div class="btns"><button class="btn primary grow" data-act="savemove">Simpan catatan</button></div>
  </section>
  <section class="ticket">
    <div class="tk-head"><h3>Catatan terakhir</h3><span class="mut small">${S.moves.length} total</span></div>
    ${recent.length?recent.map(m=>`<div class="item2">
      <div><span class="badge b-${m.type}">${TYPE_LABEL[m.type]}</span><b>${esc(m.name)}</b> ${esc(m.qty)}
        <div class="small mut">${fmt(m.date)}${m.type==='pindah'?` · ${esc(m.from||'?')} → ${esc(m.to||'?')}`:''}${m.note?' · '+esc(m.note):''}</div></div>
      <div class="r">${m.itemId?'<span class="small mut">dari belanja</span>':`<button class="btn sm danger" data-act="delmove" data-id="${m.id}">Hapus</button>`}</div>
    </div>`).join(''):'<p class="mut empty">Belum ada catatan.</p>'}
  </section>`;
}

function repData(){
  const{from,to}=S.rep;
  const inR=m=>m.date>=from&&m.date<=to;
  const mv=t=>S.moves.filter(m=>m.type===t&&inR(m)).sort((a,b)=>a.date.localeCompare(b.date));
  const pending=[];
  S.lists.forEach(L=>{if(L.date<=to)L.items.forEach(i=>{if(i.status!=='masuk')pending.push({...i,listDate:L.date})})});
  pending.sort((a,b)=>a.listDate.localeCompare(b.listDate)||a.cat.localeCompare(b.cat));
  return{masuk:mv('masuk'),keluar:mv('keluar'),pindah:mv('pindah'),pending};
}
function repText(){
  const R=repData();const{from,to}=S.rep;
  const sec=(t,arr,f)=>`\n*${t} (${arr.length}):*\n`+(arr.length?arr.map(f).join('\n'):'-');
  return `*Laporan Kitchen Floc*\n${fmt(from)}${from!==to?' - '+fmt(to):''}\n`
   +sec('Barang masuk',R.masuk,m=>`- ${m.name} ${m.qty} (${fmtShort(m.date)})${m.note?' - '+m.note:''}`)
   +sec('Barang keluar',R.keluar,m=>`- ${m.name} ${m.qty} (${fmtShort(m.date)})${m.note?' - '+m.note:''}`)
   +sec('Barang pindah',R.pindah,m=>`- ${m.name} ${m.qty}: ${m.from||'?'} → ${m.to||'?'} (${fmtShort(m.date)})`)
   +sec('Belum masuk',R.pending,i=>`- ${i.name} ${i.qty}${i.status==='sebagian'?' (masuk sebagian)':''}${i.note?' - '+i.note:''} [belanja ${fmtShort(i.listDate)}]`);
}
function viewLaporan(){
  const R=repData();const{from,to}=S.rep;
  const sec=(title,arr,cls,body)=>`<section class="ticket"><div class="tk-head"><h3>${title}</h3><span class="cnt ${cls}">${arr.length}</span></div>${arr.length?arr.map(body).join(''):'<p class="mut empty small">Tidak ada pada periode ini.</p>'}</section>`;
  const mvRow=m=>`<div class="item2"><div><b>${esc(m.name)}</b><div class="small mut">${esc(m.note||'')}</div></div><div class="r"><b>${esc(m.qty)}</b><div class="small mut">${fmtShort(m.date)}</div></div></div>`;
  return `
  <section class="ticket">
    <h2>Laporan</h2>
    <div class="dates">
      <div><label for="r-from">Dari</label><input type="date" id="r-from" data-r="from" value="${from}"></div>
      <div><label for="r-to">Sampai</label><input type="date" id="r-to" data-r="to" value="${to}"></div>
    </div>
    <div class="chips" style="margin:12px 0 0">
      <button class="chip" data-act="rng" data-v="1">Hari ini</button>
      <button class="chip" data-act="rng" data-v="3">3 hari</button>
      <button class="chip" data-act="rng" data-v="7">7 hari</button>
      <button class="chip" data-act="rng" data-v="30">30 hari</button>
    </div>
    <div class="btns noprint">
      <button class="btn primary grow" data-act="copyrep">Salin ke WhatsApp</button>
      <button class="btn grow" data-act="print">Cetak</button>
    </div>
  </section>
  <div class="tiles">
    <div class="tile t-masuk"><b>${R.masuk.length}</b>Barang masuk</div>
    <div class="tile t-keluar"><b>${R.keluar.length}</b>Barang keluar</div>
    <div class="tile t-pindah"><b>${R.pindah.length}</b>Barang pindah</div>
    <div class="tile t-belum"><b>${R.pending.length}</b>Belum masuk</div>
  </div>
  ${sec('Barang masuk',R.masuk,'full',mvRow)}
  ${sec('Barang keluar',R.keluar,'',mvRow)}
  ${sec('Barang pindah',R.pindah,'',m=>`<div class="item2"><div><b>${esc(m.name)}</b><div class="small mut">${esc(m.from||'?')} → ${esc(m.to||'?')}${m.note?' · '+esc(m.note):''}</div></div><div class="r"><b>${esc(m.qty)}</b><div class="small mut">${fmtShort(m.date)}</div></div></div>`)}
  ${sec('Belum masuk',R.pending,'',i=>`<div class="item2"><div><b>${esc(i.name)}</b><div class="small mut">${esc(i.cat)} · belanja ${fmtShort(i.listDate)}${i.status==='sebagian'?' · masuk sebagian':''}${i.note?' · '+esc(i.note):''}</div></div><div class="r"><b>${esc(i.qty)}</b></div></div>`)}`;
}

function render(){
  $('#today').textContent=dayName(today())+', '+fmt(today());
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  $('#app').innerHTML=S.view==='belanja'?viewBelanja():S.view==='catat'?viewCatat():viewLaporan();
}

/* ---------- sheets ---------- */
let sheetStatus='belum';
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');$('#panel').innerHTML=''}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Tersalin. Tinggal tempel di WhatsApp.');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Tersalin. Tinggal tempel di WhatsApp.')}catch(e){toast('Gagal menyalin')}
  ta.remove();
}

function itemSheet(id){
  const L=curList();const it=id?findItem(id):null;
  sheetStatus=it?it.status:'belum';
  const cats=[...new Set(L.items.map(i=>i.cat))];
  openSheet(`
    <h2>${it?'Ubah barang':'Tambah barang'}</h2>
    <label for="s-name">Nama barang</label><input type="text" id="s-name" value="${esc(it?it.name:'')}" autocomplete="off">
    <label for="s-qty">Jumlah belanja</label><input type="text" id="s-qty" value="${esc(it?it.qty:'')}" placeholder="contoh: 2 kg">
    <label for="s-cat">Kategori</label><input type="text" id="s-cat" list="s-cats" value="${esc(it?it.cat:(cats[0]||'Market'))}">
    <datalist id="s-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <label>Status</label>
    <div class="seg" id="s-seg">
      <button class="s-belum ${sheetStatus==='belum'?'on':''}" data-act="st" data-v="belum">Belum masuk</button>
      <button class="s-sebagian ${sheetStatus==='sebagian'?'on':''}" data-act="st" data-v="sebagian">Sebagian</button>
      <button class="s-masuk ${sheetStatus==='masuk'?'on':''}" data-act="st" data-v="masuk">Sudah masuk</button>
    </div>
    <label for="s-recv">Jumlah yang masuk (kalau beda dari belanja)</label><input type="text" id="s-recv" value="${esc(it?it.recv:'')}">
    <label for="s-date">Tanggal masuk</label><input type="date" id="s-date" value="${it&&it.receivedAt?it.receivedAt:today()}">
    <label for="s-note">Catatan</label><input type="text" id="s-note" value="${esc(it?it.note:'')}" placeholder="contoh: butuh 1 kg lagi">
    <div class="btns">
      <button class="btn primary grow" data-act="saveitem" data-id="${id||''}">Simpan</button>
      <button class="btn grow" data-act="closebtn">Batal</button>
      ${it?`<button class="btn danger" data-act="delitem" data-id="${id}">Hapus</button>`:''}
    </div>`);
}
function newListSheet(){
  const latest=[...S.lists].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const def=latest?addDays(latest.date,3):today();
  openSheet(`
    <h2>Daftar belanja baru</h2>
    <label for="n-text">Tempel teks dari WhatsApp (boleh kosong)</label>
    <textarea id="n-text" placeholder="*Pajak:*&#10;Beras 10 kg&#10;&#10;*Market:*&#10;Minyak 8 liter"></textarea>
    <p class="mut small" style="margin:4px 0 0">Judul kategori ditulis seperti *Pajak:* lalu barang di bawahnya. Tanggal dalam teks dibaca otomatis.</p>
    <label for="n-date">Tanggal belanja (dipakai kalau teks tidak ada tanggal)</label><input type="date" id="n-date" value="${def}">
    ${latest?`<label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="n-carry" checked style="width:22px;height:22px">Bawa barang yang belum masuk dari daftar sebelumnya</label>`:''}
    <div class="btns">
      <button class="btn primary grow" data-act="createlist">Buat daftar</button>
      <button class="btn grow" data-act="closebtn">Batal</button>
    </div>`);
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-view]');if(!t)return;
  if(t.dataset.view){S.view=t.dataset.view;S.delArmed=false;render();window.scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  if(a==='close'){if(e.target===t)closeSheet();return}
  if(a==='closebtn'){closeSheet();return}
  if(a==='toggle'){
    const it=findItem(id);if(!it)return;
    if(it.status==='masuk'){it.status='belum';it.receivedAt='';it.recv=''}else{it.status='masuk';it.receivedAt=today()}
    syncMove(it);persist();render();return;
  }
  if(a==='edit'){itemSheet(id);return}
  if(a==='add'){itemSheet(null);return}
  if(a==='st'){
    sheetStatus=v;document.querySelectorAll('#s-seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));return;
  }
  if(a==='saveitem'){
    const L=curList();const name=$('#s-name').value.trim();
    if(!name){toast('Isi nama barang dulu');$('#s-name').focus();return}
    let it=id?findItem(id):null;
    if(!it){it={id:uid(),status:'belum',recv:'',receivedAt:''};L.items.push(it)}
    it.name=name;it.qty=$('#s-qty').value.trim();it.cat=$('#s-cat').value.trim()||'Lainnya';
    it.note=$('#s-note').value.trim();it.recv=$('#s-recv').value.trim();it.status=sheetStatus;
    it.receivedAt=it.status==='belum'?'':($('#s-date').value||today());
    if(it.status==='belum')it.recv='';
    syncMove(it);persist();closeSheet();render();toast('Tersimpan');return;
  }
  if(a==='delitem'){
    const L=curList();L.items=L.items.filter(i=>i.id!==id);S.moves=S.moves.filter(m=>m.itemId!==id);
    persist();closeSheet();render();toast('Barang dihapus');return;
  }
  if(a==='newlist'){newListSheet();return}
  if(a==='createlist'){
    const text=$('#n-text').value;const p=parseList(text);
    const date=p.date||$('#n-date').value||today();
    const items=p.items;
    const carry=$('#n-carry');
    if(carry&&carry.checked){
      const prev=[...S.lists].filter(l=>l.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];
      if(prev){
        const have=new Set(items.map(i=>i.name.toLowerCase()));
        prev.items.filter(i=>i.status!=='masuk'&&!have.has(i.name.toLowerCase())).forEach(i=>{
          items.push({id:uid(),cat:i.cat,name:i.name,qty:i.qty,status:'belum',recv:'',receivedAt:'',note:[i.note,'sisa dari '+fmtShort(prev.date)].filter(Boolean).join(', ')});
        });
      }
    }
    const L={id:uid(),date,items};S.lists.push(L);S.active=L.id;S.filter='semua';S.delArmed=false;
    persist();closeSheet();render();toast(`Daftar dibuat: ${items.length} barang`);return;
  }
  if(a==='copylist'){const L=curList();if(L)copyText(listToText(L));return}
  if(a==='filter'){S.filter=v;render();return}
  if(a==='dellist'){
    if(!S.delArmed){S.delArmed=true;render();return}
    const L=curList();const ids=new Set(L.items.map(i=>i.id));
    S.moves=S.moves.filter(m=>!ids.has(m.itemId));S.lists=S.lists.filter(l=>l.id!==L.id);
    const latest=[...S.lists].sort((a,b)=>b.date.localeCompare(a.date))[0];S.active=latest?latest.id:null;
    S.delArmed=false;persist();render();toast('Daftar dihapus');return;
  }
  if(a==='pickType'){S.draft.type=v;render();return}
  if(a==='savemove'){
    const d=S.draft;
    if(!d.name.trim()){toast('Isi nama barang dulu');$('#f-name').focus();return}
    S.moves.push({id:uid(),itemId:null,type:d.type,date:d.date||today(),name:d.name.trim(),qty:d.qty.trim(),
      from:d.type==='pindah'?d.from.trim():'',to:d.type==='pindah'?d.to.trim():'',note:d.note.trim()});
    S.draft={...d,name:'',qty:'',note:''};
    persist();render();toast('Tersimpan');return;
  }
  if(a==='delmove'){S.moves=S.moves.filter(m=>m.id!==id);persist();render();return}
  if(a==='rng'){const n=Number(v);S.rep={from:addDays(today(),-(n-1)),to:today()};render();return}
  if(a==='copyrep'){copyText(repText());return}
  if(a==='print'){window.print();return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='listSel'){S.active=e.target.value;S.delArmed=false;persist();render()}
  if(e.target.dataset.r){S.rep[e.target.dataset.r]=e.target.value||today();render()}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(f)S.draft[f]=e.target.value;
});

/* ---------- start ---------- */
(async()=>{
  const d=await load();
  if(d){S.lists=d.lists||[];S.moves=d.moves||[];S.active=d.active}
  else{
    const p=parseList(SEED);
    const L={id:uid(),date:p.date||today(),items:p.items};
    S.lists=[L];S.active=L.id;persist();
  }
  if(!curList()){const latest=[...S.lists].sort((a,b)=>b.date.localeCompare(a.date))[0];S.active=latest?latest.id:null}
  render();
})();
</script>
</body>
</html>
